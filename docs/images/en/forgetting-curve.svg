<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Conceptual Ebbinghaus forgetting curve with spaced reviews</title>
  <desc id="description">Memory retention falls quickly without review. Spaced reviews restore retention and make each later decline more gradual.</desc>

  <rect width="1200" height="650" rx="24" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="64" fill="#111827" font-size="30" font-weight="700">Forgetting curve and spaced review</text>
    <text x="72" y="96" fill="#6b7280" font-size="18">Conceptual illustration — review timing is not to scale</text>

    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="120" y1="150" x2="1130" y2="150"/>
      <line x1="120" y1="240" x2="1130" y2="240"/>
      <line x1="120" y1="330" x2="1130" y2="330"/>
      <line x1="120" y1="420" x2="1130" y2="420"/>
      <line x1="120" y1="510" x2="1130" y2="510"/>
    </g>

    <g stroke="#9ca3af" stroke-width="2">
      <line x1="120" y1="130" x2="120" y2="510"/>
      <line x1="120" y1="510" x2="1130" y2="510"/>
    </g>

    <g fill="#6b7280" font-size="15">
      <text x="96" y="156" text-anchor="end">100%</text>
      <text x="96" y="246" text-anchor="end">75%</text>
      <text x="96" y="336" text-anchor="end">50%</text>
      <text x="96" y="426" text-anchor="end">25%</text>
      <text x="96" y="516" text-anchor="end">0%</text>

      <text x="120" y="542" text-anchor="middle">Learn</text>
      <text x="255" y="542" text-anchor="middle">1d</text>
      <text x="390" y="542" text-anchor="middle">3d</text>
      <text x="525" y="542" text-anchor="middle">7d</text>
      <text x="660" y="542" text-anchor="middle">14d</text>
      <text x="805" y="542" text-anchor="middle">30d</text>
      <text x="960" y="542" text-anchor="middle">60d</text>
      <text x="1130" y="542" text-anchor="middle">120d</text>
    </g>

    <text x="625" y="594" fill="#374151" font-size="17" text-anchor="middle">Time after learning</text>
    <text x="34" y="320" fill="#374151" font-size="17" text-anchor="middle" transform="rotate(-90 34 320)">Memory retention</text>

    <path d="M120 150 C175 212 235 320 330 390 C470 475 690 496 1130 505"
          fill="none" stroke="#6b7280" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10"/>
    <text x="440" y="438" fill="#4b5563" font-size="18" font-weight="600">Without review</text>

    <g fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round">
      <path d="M120 150 C165 205 205 265 255 305"/>
      <path d="M255 160 C300 190 345 230 390 260"/>
      <path d="M390 160 C435 183 480 210 525 235"/>
      <path d="M525 160 C570 178 615 198 660 218"/>
      <path d="M660 160 C710 174 760 190 805 207"/>
      <path d="M805 160 C855 171 910 184 960 198"/>
      <path d="M960 160 C1015 170 1075 184 1130 197"/>
    </g>

    <g stroke="#7c3aed" stroke-width="3" fill="#ffffff">
      <line x1="255" y1="305" x2="255" y2="160"/>
      <line x1="390" y1="260" x2="390" y2="160"/>
      <line x1="525" y1="235" x2="525" y2="160"/>
      <line x1="660" y1="218" x2="660" y2="160"/>
      <line x1="805" y1="207" x2="805" y2="160"/>
      <line x1="960" y1="198" x2="960" y2="160"/>
      <circle cx="255" cy="160" r="7"/>
      <circle cx="390" cy="160" r="7"/>
      <circle cx="525" cy="160" r="7"/>
      <circle cx="660" cy="160" r="7"/>
      <circle cx="805" cy="160" r="7"/>
      <circle cx="960" cy="160" r="7"/>
    </g>

    <text x="825" y="128" fill="#6d28d9" font-size="19" font-weight="700">With spaced review</text>
    <text x="825" y="236" fill="#6d28d9" font-size="16">Each decline becomes more gradual</text>
  </g>
</svg>
